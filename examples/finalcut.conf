# =============================================================================
#  Exemple de fichier de configuration finalcut
#
#  Utilisation :
#    cp examples/finalcut.conf /root/mon-serveur.conf
#    chmod 600 /root/mon-serveur.conf        (il peut contenir un mot de passe)
#    finalcut vpn install --config /root/mon-serveur.conf
#    finalcut seedbox install --config /root/mon-serveur.conf
#
#  Relancer la même commande avec le même fichier ne casse rien : finalcut
#  remet simplement tout en ordre (c'est ce qu'on appelle « idempotent »).
#  Ce fichier n'est jamais exécuté : il est seulement lu, ligne par ligne.
#  Toute clé absente prend sa valeur par défaut (indiquée entre crochets).
# =============================================================================

# --- VPN -------------------------------------------------------------------------

# Adresse à laquelle les clients se connectent. Un nom de domaine est conseillé :
# en cas de changement de serveur, les clients n'ont rien à modifier.
# [IP publique détectée automatiquement]
VPN_ENDPOINT=vpn.example.org

# Port UDP du VPN [51820]
VPN_PORT=51820

# DNS des clients : quad9, cloudflare, ou des adresses IP [quad9]
VPN_DNS=quad9

# Clients à créer (ceux qui existent déjà sont gardés tels quels) [aucun]
VPN_CLIENTS="telephone pc-salon"

# --- Seedbox ---------------------------------------------------------------------

# Utilisateur de l'interface web et du SFTP [lancelot]
SB_USER=lancelot

# Mot de passe (10 caractères minimum). Mieux : un fichier à part, en 600.
# Sans les deux, un mot de passe est généré et affiché à la première installation.
#SB_PASSWORD=un-mot-de-passe-solide
SB_PASSWORD_FILE=/root/seedbox-motdepasse

# Nom de domaine pointant vers le serveur, ou son IP
# [nom fourni par l'hébergeur s'il pointe bien ici, sinon l'IP]
SB_DOMAIN=seedbox.example.org

# Dossier des données [plus grande partition, ou /srv/seedbox]
SB_DATA=/srv/seedbox

# Certificat Let's Encrypt : auto (si le DNS pointe ici), yes, no [auto]
SB_LETSENCRYPT=auto

# Serveurs Let's Encrypt : production, ou staging pour les essais
# (sans limite, mais certificat non reconnu par les navigateurs) [production]
SB_ACME=production

# Clés SSH publiques autorisées pour le SFTP (une par ligne) [aucune]
#SB_SSH_KEYS_FILE=/root/.ssh/authorized_keys

# Mot de passe accepté en SFTP : yes, ou no pour les clés seules [yes]
SB_SFTP_PASSWORD=yes

# --- Serveur ---------------------------------------------------------------------

# Activer le pare-feu après l'installation : yes ou no [no]
FIREWALL=no
