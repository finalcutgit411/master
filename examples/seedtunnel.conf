# =============================================================================
#  Example configuration file for seedtunnel
#
#  Usage:
#    cp examples/seedtunnel.conf /root/my-server.conf
#    chmod 600 /root/my-server.conf          (it may hold a password)
#    seedtunnel vpn install --config /root/my-server.conf
#    seedtunnel seedbox install --config /root/my-server.conf
#
#  Running the same command again with the same file breaks nothing:
#  seedtunnel simply puts everything back in order (it is « idempotent »).
#  This file is never executed: it is only read, line by line.
#  A missing key takes its default value (shown in brackets).
# =============================================================================

# Language of the messages on this server: en or fr
# [language of the system, otherwise en]
LANGUAGE=en

# --- VPN -------------------------------------------------------------------------

# Address the clients connect to. A domain name is best: if you move to another
# server, the clients have nothing to change.
# [public IP address, detected automatically]
VPN_PUBLIC_ADDRESS=vpn.example.org

# UDP port of the VPN [51820]
VPN_PORT=51820

# DNS servers of the clients: quad9, cloudflare, or IP addresses [quad9]
VPN_DNS=quad9

# Clients to create (existing ones are kept as they are) [none]
VPN_CLIENTS="phone laptop"

# --- Seedbox ---------------------------------------------------------------------

# User of the web interface and of SFTP [lancelot]
SEEDBOX_USER=lancelot

# Password (10 characters at least). Better: a separate file, mode 600.
# Without either, a password is generated and shown at the first installation.
#SEEDBOX_PASSWORD=a-strong-password
SEEDBOX_PASSWORD_FILE=/root/seedbox-password

# Domain name pointing to the server, or its IP address
# [name given by the provider if it points here, otherwise the IP address]
SEEDBOX_DOMAIN=seedbox.example.org

# Folder of the downloads [largest partition, or /srv/seedbox]
SEEDBOX_DATA_DIR=/srv/seedbox

# Let's Encrypt certificate: auto (if the DNS points here), yes, no [auto]
SEEDBOX_LETSENCRYPT=auto

# Let's Encrypt servers: production, or staging for your tests
# (much higher limits, but a certificate browsers do not trust) [production]
SEEDBOX_LETSENCRYPT_SERVER=production

# SSH public keys allowed for SFTP (one per line) [none]
#SEEDBOX_SSH_KEYS_FILE=/root/.ssh/authorized_keys

# Password accepted in SFTP: yes, or no for keys only [yes]
SEEDBOX_SFTP_PASSWORD=yes

# --- Server ----------------------------------------------------------------------

# Turn the firewall on after the installation: yes or no [no]
FIREWALL=no
